name: Daily push reminders

# Fires every 15 min so scheduled broadcasts go out promptly. The API still only
# sends each family their daily tip once (deduped, at their chosen local hour),
# so the effective daily cadence is unchanged — this just tightens latency for
# admin-scheduled broadcasts.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily-push endpoint
        run: |
          curl -sS -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            https://daybydayapi-production.up.railway.app/v1/internal/cron/daily-push
